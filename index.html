<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Synth Highway 1984 - Experiencia Cyberpunk</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Tone.js para Sintetizador y Música -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@400;600;700&display=swap');

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #05020a;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Aesthetics Glassmorphism Cyberpunk */
        .cyber-panel {
            background: rgba(13, 6, 32, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 0, 128, 0.3);
            box-shadow: 0 0 25px rgba(255, 0, 128, 0.15), inset 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .cyber-btn {
            background: linear-gradient(135deg, rgba(255, 0, 128, 0.1), rgba(0, 240, 255, 0.1));
            border: 1px solid rgba(255, 0, 128, 0.4);
            color: #00f0ff;
            transition: all 0.2s ease;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
        }

        .cyber-btn:hover {
            background: linear-gradient(135deg, rgba(255, 0, 128, 0.4), rgba(0, 240, 255, 0.4));
            border-color: #00f0ff;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.8), 0 0 25px rgba(255, 0, 128, 0.6);
            transform: translateY(-2px);
        }

        .cyber-btn.active {
            background: linear-gradient(135deg, #ff007f, #00f0ff);
            color: #000;
            font-weight: bold;
            border-color: #ffffff;
            box-shadow: 0 0 20px #ff007f, 0 0 30px #00f0ff;
            text-shadow: none;
        }

        /* Pad Teclas del Sintetizador */
        .synth-key {
            transition: all 0.1s ease;
            background: rgba(20, 10, 45, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.3);
        }
        .synth-key:hover {
            border-color: #ff007f;
            box-shadow: 0 0 12px #ff007f;
        }
        .synth-key.pressed {
            background: #ff007f !important;
            color: #000 !important;
            box-shadow: 0 0 25px #ff007f, 0 0 35px #00f0ff !important;
            transform: scale(0.95);
        }

        /* Neon Text Glow */
        .neon-text-pink {
            text-shadow: 0 0 5px #ff007f, 0 0 15px #ff007f, 0 0 30px #ff007f;
        }
        .neon-text-cyan {
            text-shadow: 0 0 5px #00f0ff, 0 0 15px #00f0ff, 0 0 30px #00f0ff;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        ::-webkit-scrollbar-thumb { background: #ff007f; border-radius: 2px; }

        .ui-hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden">

    <!-- 3D Canvas Viewport -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div id="ui-layer" class="relative z-10 w-full h-full pointer-events-none flex flex-col justify-between p-4 md:p-6 transition-opacity duration-300">
        
        <!-- Header / Logo Top Bar -->
        <div class="flex justify-between items-start pointer-events-auto">
            <div>
                <h1 class="text-3xl md:text-5xl font-black font-orbitron tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 neon-text-pink">
                    CYBERWAY <span class="text-xs text-cyan-400 font-light tracking-normal block md:inline font-sans">1984 RETRO-SYNTH</span>
                </h1>
                <p class="text-xs text-cyan-300/80 font-semibold tracking-wider uppercase mt-1">
                    <i class="fa-solid fa-compact-disc animate-spin mr-1 text-pink-500"></i> Autopista Neón & Sintetizador Interactivo
                </p>
            </div>

            <!-- Top Actions Controls -->
            <div class="flex items-center space-x-3">
                <button id="btn-beat" class="cyber-btn px-4 py-2 rounded-lg text-xs font-bold font-orbitron flex items-center gap-2">
                    <i class="fa-solid fa-play text-pink-500" id="beat-icon"></i>
                    <span id="beat-text">RETRO BEAT LOOP</span>
                </button>

                <button id="btn-fullscreen" class="cyber-btn p-3 rounded-lg text-white flex items-center justify-center w-10 h-10" title="Pantalla Completa">
                    <i class="fa-solid fa-expand"></i>
                </button>

                <button id="btn-toggle-ui" class="cyber-btn p-3 rounded-lg text-white flex items-center justify-center w-10 h-10" title="Ocultar Interfaz (H)">
                    <i class="fa-solid fa-eye-slash"></i>
                </button>
            </div>
        </div>

        <!-- Center Prompt -->
        <div id="center-hint" class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center pointer-events-none transition-opacity duration-500">
            <p class="text-lg md:text-2xl font-orbitron font-bold text-cyan-300 neon-text-cyan animate-pulse">
                TOCA LAS TECLAS [A - K] O USA EL TECLADO SINTETIZADOR
            </p>
            <p class="text-xs text-pink-300/80 mt-2 font-mono">
                [Haz clic en el cielo para meteoros de neón | Arrastra para mover la cámara]
            </p>
        </div>

        <!-- Synth Pads & Controls Container (Bottom) -->
        <div class="flex flex-col gap-3 pointer-events-auto max-w-5xl mx-auto w-full">
            
            <!-- Interactive Synth Piano Keypad -->
            <div class="cyber-panel p-3 rounded-xl flex justify-center items-center gap-1.5 md:gap-2 overflow-x-auto">
                <button data-note="C3" data-key="a" class="synth-key px-3 py-4 md:px-5 md:py-6 rounded-lg text-xs md:text-sm font-bold font-orbitron text-cyan-300 flex flex-col items-center flex-1">
                    <span>DO</span><span class="text-[10px] text-pink-400 mt-1">[A]</span>
                </button>
                <button data-note="D3" data-key="s" class="synth-key px-3 py-4 md:px-5 md:py-6 rounded-lg text-xs md:text-sm font-bold font-orbitron text-cyan-300 flex flex-col items-center flex-1">
                    <span>RE</span><span class="text-[10px] text-pink-400 mt-1">[S]</span>
                </button>
                <button data-note="E3" data-key="d" class="synth-key px-3 py-4 md:px-5 md:py-6 rounded-lg text-xs md:text-sm font-bold font-orbitron text-cyan-300 flex flex-col items-center flex-1">
                    <span>MI</span><span class="text-[10px] text-pink-400 mt-1">[D]</span>
                </button>
                <button data-note="F3" data-key="f" class="synth-key px-3 py-4 md:px-5 md:py-6 rounded-lg text-xs md:text-sm font-bold font-orbitron text-cyan-300 flex flex-col items-center flex-1">
                    <span>FA</span><span class="text-[10px] text-pink-400 mt-1">[F]</span>
                </button>
                <button data-note="G3" data-key="g" class="synth-key px-3 py-4 md:px-5 md:py-6 rounded-lg text-xs md:text-sm font-bold font-orbitron text-cyan-300 flex flex-col items-center flex-1">
                    <span>SOL</span><span class="text-[10px] text-pink-400 mt-1">[G]</span>
                </button>
                <button data-note="A3" data-key="h" class="synth-key px-3 py-4 md:px-5 md:py-6 rounded-lg text-xs md:text-sm font-bold font-orbitron text-cyan-300 flex flex-col items-center flex-1">
                    <span>LA</span><span class="text-[10px] text-pink-400 mt-1">[H]</span>
                </button>
                <button data-note="B3" data-key="j" class="synth-key px-3 py-4 md:px-5 md:py-6 rounded-lg text-xs md:text-sm font-bold font-orbitron text-cyan-300 flex flex-col items-center flex-1">
                    <span>SI</span><span class="text-[10px] text-pink-400 mt-1">[J]</span>
                </button>
                <button data-note="C4" data-key="k" class="synth-key px-3 py-4 md:px-5 md:py-6 rounded-lg text-xs md:text-sm font-bold font-orbitron text-cyan-300 flex flex-col items-center flex-1">
                    <span>DO+</span><span class="text-[10px] text-pink-400 mt-1">[K]</span>
                </button>
            </div>

            <!-- Bottom Toolbar Controls -->
            <div class="flex flex-wrap items-center justify-between gap-3">
                <!-- Modes Selector -->
                <div class="cyber-panel p-2 rounded-xl flex items-center space-x-2">
                    <span class="text-xs font-orbitron text-pink-400 ml-2 hidden sm:inline">MODO:</span>
                    <button data-mode="synthwave" class="mode-btn cyber-btn active px-3 py-1.5 rounded-lg text-xs font-orbitron">
                        <i class="fa-solid fa-road mr-1"></i> SYNTH GRID
                    </button>
                    <button data-mode="matrix" class="mode-btn cyber-btn px-3 py-1.5 rounded-lg text-xs font-orbitron">
                        <i class="fa-solid fa-code-branch mr-1"></i> MATRIX RAIN
                    </button>
                    <button data-mode="hyper" class="mode-btn cyber-btn px-3 py-1.5 rounded-lg text-xs font-orbitron">
                        <i class="fa-solid fa-meteor mr-1"></i> HYPER-WARP
                    </button>
                </div>

                <!-- Speed Control & Car Toggle -->
                <div class="cyber-panel p-2 rounded-xl flex items-center space-x-4">
                    <!-- Speed slider -->
                    <div class="flex items-center space-x-2 px-2">
                        <i class="fa-solid fa-gauge-high text-cyan-400 text-xs"></i>
                        <span class="text-xs font-orbitron text-cyan-300">VELOCIDAD:</span>
                        <input id="speed-slider" type="range" min="0.2" max="3.5" step="0.1" value="1.0" class="w-24 accent-pink-500 cursor-pointer">
                    </div>

                    <div class="h-4 w-[1px] bg-pink-500/30"></div>

                    <!-- Vehicle Toggle -->
                    <button id="btn-vehicle" class="cyber-btn px-3 py-1.5 rounded-lg text-xs font-orbitron flex items-center gap-1.5">
                        <i class="fa-solid fa-car text-pink-500"></i>
                        <span id="vehicle-status">AUTO: SI</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Unhide UI Button -->
    <div id="unhide-hint" class="fixed top-4 right-4 z-20 pointer-events-auto opacity-0 transition-opacity duration-300">
        <button id="btn-show-ui" class="cyber-btn p-3 rounded-lg text-cyan-400">
            <i class="fa-solid fa-eye text-lg"></i>
        </button>
    </div>

    <script>
        /**
         * CYBERWAY 1984 - Motor de Escena Three.js & Sintetizador Tone.js
         */

        const STATE = {
            speed: 1.0,
            mode: 'synthwave', // synthwave, matrix, hyper
            showVehicle: true,
            isBeatPlaying: false,
            audioStarted: false
        };

        // Escena 3D y Elementos
        let scene, camera, renderer;
        let gridMesh, sunMesh, mountainsMesh, starField, carMesh;
        let matrixParticles, hyperWarpParticles;
        let meteors = [];

        // Tone.js Audio Engine
        let synth, bassSynth, synthReverb, synthDelay, beatLoop;
        let audioAnalyser;

        // Variables de interacción
        const mouse = new THREE.Vector2();
        let targetCamX = 0, targetCamY = 3;

        window.onload = function() {
            initThree();
            createSynthwaveWorld();
            createCyberVehicle();
            initAudioEngine();
            initEventListeners();
            animate();

            // Ocultar mensaje inicial tras unos segundos
            setTimeout(() => {
                const hint = document.getElementById('center-hint');
                if (hint) hint.style.opacity = '0';
            }, 7000);
        };

        /**
         * Inicializar Configuración 3D
         */
        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x05020a, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x05020a, 1.0);
            container.appendChild(renderer.domElement);

            // Iluminación Neon
            const ambientLight = new THREE.AmbientLight(0xff007f, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00f0ff, 1.2);
            dirLight.position.set(0, 20, -40);
            scene.add(dirLight);
        }

        /**
         * Crear la estética Synthwave: Sol de Neón, Rejilla Infinita y Montañas Wireframe
         */
        function createSynthwaveWorld() {
            // 1. Sol Retro en el Horizonte con Textura Generada de Franjas
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 256);
            grad.addColorStop(0, '#ffe600');
            grad.addColorStop(0.5, '#ff007f');
            grad.addColorStop(1, '#7900ff');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);

            // Cortar franjas horizontales retro
            ctx.fillStyle = '#05020a';
            for (let i = 0; i < 10; i++) {
                const h = i * 2.5 + 2;
                const y = 140 + i * 11;
                ctx.fillRect(0, y, 256, h);
            }

            const sunTexture = new THREE.CanvasTexture(canvas);
            const sunGeo = new THREE.CircleGeometry(22, 64);
            const sunMat = new THREE.MeshBasicMaterial({ map: sunTexture, transparent: true });
            sunMesh = new THREE.Mesh(sunGeo, sunMat);
            sunMesh.position.set(0, 8, -120);
            scene.add(sunMesh);

            // 2. Rejilla 3D de Autopista Wireframe en Movimiento
            const gridGeo = new THREE.PlaneGeometry(160, 300, 80, 120);
            const gridMat = new THREE.MeshBasicMaterial({
                color: 0xff007f,
                wireframe: true,
                transparent: true,
                opacity: 0.75
            });
            gridMesh = new THREE.Mesh(gridGeo, gridMat);
            gridMesh.rotation.x = -Math.PI / 2;
            gridMesh.position.set(0, -1, -50);
            scene.add(gridMesh);

            // 3. Montañas Neón Laterales Wireframe
            const mountGeo = new THREE.PlaneGeometry(80, 260, 32, 64);
            const mountPos = mountGeo.attributes.position;
            for (let i = 0; i < mountPos.count; i++) {
                const x = mountPos.getX(i);
                const y = mountPos.getY(i);
                // Elevar relieve de montañas a los costados
                if (Math.abs(x) > 15) {
                    const noise = Math.sin(x * 0.2) * Math.cos(y * 0.1) * 12 + Math.random() * 2;
                    mountPos.setZ(i, Math.abs(noise));
                }
            }
            mountGeo.computeVertexNormals();

            const mountMat = new THREE.MeshBasicMaterial({
                color: 0x00f0ff,
                wireframe: true,
                transparent: true,
                opacity: 0.4
            });
            mountainsMesh = new THREE.Mesh(mountGeo, mountMat);
            mountainsMesh.rotation.x = -Math.PI / 2;
            mountainsMesh.position.set(0, -0.5, -60);
            scene.add(mountainsMesh);

            // 4. Campo de Estrellas Retro
            const starGeo = new THREE.BufferGeometry();
            const starCount = 2000;
            const starPositions = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount * 3; i += 3) {
                starPositions[i] = (Math.random() - 0.5) * 300;
                starPositions[i + 1] = Math.random() * 100 + 5;
                starPositions[i + 2] = (Math.random() - 0.5) * 300 - 50;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.6, transparent: true, opacity: 0.8 });
            starField = new THREE.Points(starGeo, starMat);
            scene.add(starField);

            // 5. Partículas adicionales para modos especiales
            createMatrixAndHyperParticles();
        }

        /**
         * Crear auto Deportivo Cyberpunk Wireframe / Neón
         */
        function createCyberVehicle() {
            carMesh = new THREE.Group();

            // Chasis
            const bodyGeo = new THREE.BoxGeometry(2.2, 0.7, 4.5);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0a0518, metalness: 0.8, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            carMesh.add(body);

            // Bordes neón del auto
            const wireGeo = new THREE.EdgesGeometry(bodyGeo);
            const wireMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, linewidth: 2 });
            const wireframe = new THREE.LineSegments(wireGeo, wireMat);
            wireframe.position.y = 0.6;
            carMesh.add(wireframe);

            // Luces traseras neón rosa
            const tailGeo = new THREE.BoxGeometry(1.8, 0.15, 0.1);
            const tailMat = new THREE.MeshBasicMaterial({ color: 0xff007f });
            const tailLights = new THREE.Mesh(tailGeo, tailMat);
            tailLights.position.set(0, 0.7, 2.26);
            carMesh.add(tailLights);

            carMesh.position.set(0, 0, 5);
            scene.add(carMesh);
        }

        /**
         * Partículas para Modo Matrix y Hyper-Warp
         */
        function createMatrixAndHyperParticles() {
            // Matrix Rain Particles
            const mCount = 1500;
            const mGeo = new THREE.BufferGeometry();
            const mPos = new Float32Array(mCount * 3);
            for (let i = 0; i < mCount * 3; i += 3) {
                mPos[i] = (Math.random() - 0.5) * 80;
                mPos[i + 1] = Math.random() * 60;
                mPos[i + 2] = (Math.random() - 0.5) * 80;
            }
            mGeo.setAttribute('position', new THREE.BufferAttribute(mPos, 3));
            const mMat = new THREE.PointsMaterial({ color: 0x00ff66, size: 0.7, transparent: true, opacity: 0 });
            matrixParticles = new THREE.Points(mGeo, mMat);
            scene.add(matrixParticles);

            // Hyper-Warp Particles
            const hCount = 3000;
            const hGeo = new THREE.BufferGeometry();
            const hPos = new Float32Array(hCount * 3);
            for (let i = 0; i < hCount * 3; i += 3) {
                hPos[i] = (Math.random() - 0.5) * 120;
                hPos[i + 1] = (Math.random() - 0.5) * 120;
                hPos[i + 2] = Math.random() * -200;
            }
            hGeo.setAttribute('position', new THREE.BufferAttribute(hPos, 3));
            const hMat = new THREE.PointsMaterial({ color: 0xff00ff, size: 0.9, transparent: true, opacity: 0 });
            hyperWarpParticles = new THREE.Points(hGeo, hMat);
            scene.add(hyperWarpParticles);
        }

        /**
         * Inicializar Sintetizador de Audio con Tone.js
         */
        function initAudioEngine() {
            try {
                // Efecto Reverb y Delay Cyberpunk
                synthReverb = new Tone.Reverb({ decay: 3, wet: 0.4 }).toDestination();
                synthDelay = new Tone.PingPongDelay({ delayTime: "8n", feedback: 0.3, wet: 0.3 }).connect(synthReverb);

                // Polifónico Principal (FM Synth para sonido retro)
                synth = new Tone.PolySynth(Tone.FMSynth, {
                    harmonicity: 2,
                    modulationIndex: 35,
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.02, decay: 0.3, sustain: 0.5, release: 1 },
                    modulation: { type: "triangle" }
                }).connect(synthDelay);
                synth.volume.value = -6;

                // Sintetizador de Bajo Retro
                bassSynth = new Tone.MonoSynth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0.4, release: 0.4 },
                    filterEnvelope: { attack: 0.01, decay: 0.1, sustain: 0.8, baseFrequency: 80, octaves: 4 }
                }).toDestination();
                bassSynth.volume.value = -8;

                // Analizador de Audio para reactividad visual
                audioAnalyser = new Tone.Analyser("waveform", 64);
                Tone.Destination.connect(audioAnalyser);

            } catch(e) {
                console.warn("Audio Context delay", e);
            }
        }

        /**
         * Bucle de Acompañamiento Retro Beat en Tiempo Real
         */
        function toggleRetroBeat() {
            if (!STATE.audioStarted) {
                Tone.start();
                STATE.audioStarted = true;
            }

            const btnText = document.getElementById('beat-text');
            const btnIcon = document.getElementById('beat-icon');

            if (STATE.isBeatPlaying) {
                Tone.Transport.stop();
                Tone.Transport.cancel();
                STATE.isBeatPlaying = false;
                btnText.textContent = "RETRO BEAT LOOP";
                btnIcon.className = "fa-solid fa-play text-pink-500";
            } else {
                // Secuencia de Bajo & Synthwave Loop
                const bassNotes = ["C2", "C2", "Eb2", "F2", "G2", "G2", "Bb2", "C2"];
                let step = 0;

                Tone.Transport.scheduleRepeat((time) => {
                    const note = bassNotes[step % bassNotes.length];
                    bassSynth.triggerAttackRelease(note, "8n", time);
                    
                    // Pulso visual sutil en cada pulso de bajo
                    pulseGridOnBeat();
                    step++;
                }, "8n");

                Tone.Transport.bpm.value = 115;
                Tone.Transport.start();

                STATE.isBeatPlaying = true;
                btnText.textContent = "DETENER BEAT";
                btnIcon.className = "fa-solid fa-square text-cyan-400";
            }
        }

        /**
         * Pulso visual en las estructuras 3D al sonar notas
         */
        function pulseGridOnBeat(intensity = 1.0) {
            if (gridMesh) {
                gridMesh.material.color.setHex(0x00f0ff);
                setTimeout(() => gridMesh.material.color.setHex(0xff007f), 120);
            }
            if (sunMesh) {
                sunMesh.scale.setScalar(1.0 + 0.08 * intensity);
                setTimeout(() => sunMesh.scale.setScalar(1.0), 150);
            }
        }

        /**
         * Reproduce una nota del Sintetizador
         */
        function playNote(note) {
            if (!STATE.audioStarted) {
                Tone.start();
                STATE.audioStarted = true;
            }
            if (synth) {
                synth.triggerAttackRelease(note, "8n");
                pulseGridOnBeat(1.5);
                spawnNeonMeteor();
            }
        }

        /**
         * Meteoros de Neón dinámicos al interactuar
         */
        function spawnNeonMeteor() {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array([0,0,0, (Math.random()-0.5)*10, (Math.random()-0.5)*10, -20]);
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            
            const mat = new THREE.LineBasicMaterial({
                color: Math.random() > 0.5 ? 0x00f0ff : 0xff007f,
                linewidth: 3,
                transparent: true,
                opacity: 1
            });
            const meteor = new THREE.Line(geo, mat);
            meteor.position.set((Math.random() - 0.5) * 80, Math.random() * 30 + 10, -100);
            scene.add(meteor);

            meteors.push({ mesh: meteor, speed: Math.random() * 2 + 3, life: 1.0 });
        }

        /**
         * Bucle Principal de Renderizado y Animación (60 FPS)
         */
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            const moveSpeed = STATE.speed;

            // 1. Movimiento infinito de la Carretera Grid & Montañas
            if (gridMesh) {
                gridMesh.position.z += moveSpeed * 0.8;
                if (gridMesh.position.z > 0) gridMesh.position.z = -50;
            }
            if (mountainsMesh) {
                mountainsMesh.position.z += moveSpeed * 0.4;
                if (mountainsMesh.position.z > 0) mountainsMesh.position.z = -60;
            }

            // 2. Animación suave del auto Cyberpunk
            if (carMesh) {
                carMesh.visible = STATE.showVehicle && (STATE.mode === 'synthwave');
                carMesh.position.x += (targetCamX * 4 - carMesh.position.x) * 0.08;
                carMesh.rotation.z = -(carMesh.position.x - targetCamX * 4) * 0.05; // Inclinación al girar
                carMesh.position.y = Math.sin(time * 10) * 0.03; // Inclinación/Vibración de motor
            }

            // 3. Modos Especiales (Matrix & Hyper-Warp)
            if (STATE.mode === 'matrix') {
                const mPos = matrixParticles.geometry.attributes.position;
                for (let i = 1; i < mPos.count * 3; i += 3) {
                    mPos.array[i] -= moveSpeed * 0.8;
                    if (mPos.array[i] < 0) mPos.array[i] = 60;
                }
                mPos.needsUpdate = true;
            } else if (STATE.mode === 'hyper') {
                const hPos = hyperWarpParticles.geometry.attributes.position;
                for (let i = 2; i < hPos.count * 3; i += 3) {
                    hPos.array[i] += moveSpeed * 4.0;
                    if (hPos.array[i] > 10) hPos.array[i] = -200;
                }
                hPos.needsUpdate = true;
            }

            // 4. Mover Meteoros
            for (let i = meteors.length - 1; i >= 0; i--) {
                const m = meteors[i];
                m.mesh.position.z += m.speed * 2;
                m.mesh.position.y -= m.speed * 0.5;
                m.life -= 0.02;
                m.mesh.material.opacity = m.life;
                if (m.life <= 0) {
                    scene.remove(m.mesh);
                    meteors.splice(i, 1);
                }
            }

            // 5. Transición fluida de la Cámara inclinada por el mouse
            camera.position.x += (targetCamX * 3 - camera.position.x) * 0.05;
            camera.position.y += (targetCamY - camera.position.y) * 0.05;
            camera.lookAt(0, 2, -50);

            renderer.render(scene, camera);
        }

        /**
         * Manejadores de Eventos e Interacción
         */
        function initEventListeners() {
            window.addEventListener('resize', onWindowResize);

            // Control de Cámara con Movimiento de Cursor / Touch
            window.addEventListener('mousemove', (e) => {
                targetCamX = (e.clientX / window.innerWidth) * 2 - 1;
                targetCamY = -(e.clientY / window.innerHeight) * 2 + 4;
            });

            // Clic en la Pantalla para Meteoros de Neón
            window.addEventListener('click', (e) => {
                if (e.target.closest('#ui-layer')) return;
                spawnNeonMeteor();
                playNote("G4");
            });

            // Teclado Físico (A S D F G H J K) para Sintetizador
            const keyNoteMap = {
                'a': 'C3', 's': 'D3', 'd': 'E3', 'f': 'F3',
                'g': 'G3', 'h': 'A3', 'j': 'B3', 'k': 'C4'
            };

            window.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (keyNoteMap[key]) {
                    const btn = document.querySelector(`[data-key="${key}"]`);
                    if (btn && !btn.classList.contains('pressed')) {
                        btn.classList.add('pressed');
                        playNote(keyNoteMap[key]);
                    }
                } else if (key === 'h') {
                    toggleUI();
                }
            });

            window.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                if (keyNoteMap[key]) {
                    const btn = document.querySelector(`[data-key="${key}"]`);
                    if (btn) btn.classList.remove('pressed');
                }
            });

            // Teclas en Pantalla (Piano Synth)
            document.querySelectorAll('.synth-key').forEach(keyBtn => {
                keyBtn.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    const note = keyBtn.getAttribute('data-note');
                    keyBtn.classList.add('pressed');
                    playNote(note);
                });
                keyBtn.addEventListener('mouseup', () => keyBtn.classList.remove('pressed'));
                keyBtn.addEventListener('mouseleave', () => keyBtn.classList.remove('pressed'));
                keyBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const note = keyBtn.getAttribute('data-note');
                    keyBtn.classList.add('pressed');
                    playNote(note);
                });
                keyBtn.addEventListener('touchend', () => keyBtn.classList.remove('pressed'));
            });

            // Retro Beat Toggle Button
            document.getElementById('btn-beat').addEventListener('click', toggleRetroBeat);

            // Velocidad Slider
            document.getElementById('speed-slider').addEventListener('input', (e) => {
                STATE.speed = parseFloat(e.target.value);
            });

            // Selector de Modos
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    STATE.mode = btn.getAttribute('data-mode');

                    // Cambiar visibilidad de elementos según modo
                    if (STATE.mode === 'synthwave') {
                        gridMesh.visible = true;
                        mountainsMesh.visible = true;
                        sunMesh.visible = true;
                        matrixParticles.material.opacity = 0;
                        hyperWarpParticles.material.opacity = 0;
                    } else if (STATE.mode === 'matrix') {
                        gridMesh.visible = false;
                        mountainsMesh.visible = false;
                        sunMesh.visible = false;
                        matrixParticles.material.opacity = 0.9;
                        hyperWarpParticles.material.opacity = 0;
                    } else if (STATE.mode === 'hyper') {
                        gridMesh.visible = false;
                        mountainsMesh.visible = false;
                        sunMesh.visible = true;
                        matrixParticles.material.opacity = 0;
                        hyperWarpParticles.material.opacity = 1.0;
                    }
                });
            });

            // Botón Mostrar/Ocultar Auto
            const btnVehicle = document.getElementById('btn-vehicle');
            btnVehicle.addEventListener('click', () => {
                STATE.showVehicle = !STATE.showVehicle;
                document.getElementById('vehicle-status').textContent = STATE.showVehicle ? "AUTO: SI" : "AUTO: NO";
            });

            // Fullscreen Toggle
            document.getElementById('btn-fullscreen').addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            });

            // UI Hide / Show
            document.getElementById('btn-toggle-ui').addEventListener('click', toggleUI);
            document.getElementById('btn-show-ui').addEventListener('click', toggleUI);
        }

        function toggleUI() {
            const uiLayer = document.getElementById('ui-layer');
            const unhideHint = document.getElementById('unhide-hint');
            if (uiLayer.classList.contains('ui-hidden')) {
                uiLayer.classList.remove('ui-hidden');
                unhideHint.style.opacity = '0';
            } else {
                uiLayer.classList.add('ui-hidden');
                unhideHint.style.opacity = '1';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
